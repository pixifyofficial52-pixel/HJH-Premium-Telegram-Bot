<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HJH Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: #1a1a2e; padding: 40px; border-radius: 12px; border: 1px solid #2a2a4e; max-width: 500px; width: 90%; }
        h1 { color: #7c5cfc; text-align: center; margin-bottom: 20px; }
        .stat { background: #0f0f1a; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 3px solid #7c5cfc; }
        .stat .number { font-size: 24px; font-weight: bold; color: #7c5cfc; }
        .stat .label { color: #a0a0c0; font-size: 12px; }
        .login { margin-top: 20px; }
        input { width: 100%; padding: 12px; background: #0f0f1a; border: 1px solid #2a2a4e; border-radius: 8px; color: #e0e0e0; }
        button { width: 100%; padding: 12px; background: #7c5cfc; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background: #6a4ae8; }
        .hidden { display: none; }
        .error { color: #e74c3c; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <h1>👑 HJH Admin</h1>
        <p style="color:#a0a0c0;text-align:center;margin-bottom:20px;">Enter your Telegram ID</p>
        <input type="text" id="userIdInput" placeholder="Enter your Telegram ID">
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
    </div>

    <div class="container hidden" id="dashboard">
        <h1>📊 Dashboard</h1>
        <div class="stat"><div class="number" id="totalUsers">0</div><div class="label">Total Users</div></div>
        <div class="stat"><div class="number" id="verifiedUsers">0</div><div class="label">Verified Users</div></div>
        <button onclick="logout()" style="background:#e74c3c;margin-top:20px;">Logout</button>
    </div>

    <script>
        let userId = '';
        function login() {
            const input = document.getElementById('userIdInput').value.trim();
            if (!input) { document.getElementById('loginError').textContent = 'Please enter your ID'; return; }
            userId = input;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadStats();
        }
        function logout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                document.getElementById('verifiedUsers').textContent = data.verifiedCount || 0;
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
